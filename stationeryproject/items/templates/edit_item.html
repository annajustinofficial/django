{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Edit Item</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

<h2>Edit Item</h2>

<form method="POST">

    {% csrf_token %}

    <label>Item Name</label><br>
    <input type="text" name="item_name" value="{{ item.item_name }}"><br><br>

    <label>Brand</label><br>
    <input type="text" name="brand" value="{{ item.brand }}"><br><br>

    <label>Quantity</label><br>
    <input type="text" name="quantity" value="{{ item.quantity }}"><br><br>

    <label>Price</label><br>
    <input type="text" name="price" value="{{ item.price }}"><br><br>

    <button type="submit">Update Item</button>

</form>

</body>
</html>
